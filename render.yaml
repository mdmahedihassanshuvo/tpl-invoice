databases:
  - name: tpl-invoice-db
    plan: free
    databaseName: tpl_invoice
    user: tpl_invoice

services:
  - type: web
    name: tpl-invoice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn TPL_Invoice.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tpl-invoice-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'false'
